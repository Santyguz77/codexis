    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#b2dfdb",
                        "primary-dark": "#80cbc4",
                        "background-light": "#f9f9f9",
                        "background-dark": "#09090b",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#18181b",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: { DEFAULT: "0px" },
                    boxShadow: {
                        'soft': '0 1px 3px rgba(0,0,0,0.05), 0 20px 40px rgba(0,0,0,0.02)',
                        'glow': '0 0 20px rgba(178, 223, 219, 0.2)',
                    }
                },
            },
        };
    </script>
    <style>
        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .dashed-ring {
            animation: spin-slow 20s linear infinite;
        }

        body {
            min-height: max(884px, 100dvh);
            font-family: 'Inter', sans-serif;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .float-anim {
            animation: float 3s ease-in-out infinite;
        }

        .card-blur {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.8);
        }

        .dark .card-blur {
            background: rgba(24, 24, 27, 0.8);
        }
    </style>
</head>

        onclick="document.documentElement.classList.toggle('dark')">
        <span class="material-icons-round dark:hidden text-lg">dark_mode</span>
        <span class="material-icons-round hidden dark:block text-lg">light_mode</span>
    </button>

    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
