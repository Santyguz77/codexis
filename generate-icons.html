<!DOCTYPE html>
<html>
<head>
  <title>Generar Iconos</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    button { padding: 10px 20px; margin: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Generador de Iconos PWA - Suscripciones</h1>
  
  <div>
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="icon512" width="512" height="512"></canvas>
  </div>
  
  <button onclick="downloadIcon('icon192', 'icon-192.png')">Descargar 192x192</button>
  <button onclick="downloadIcon('icon512', 'icon-512.png')">Descargar 512x512</button>
  
  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Fondo con gradiente
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#6366f1');
      gradient.addColorStop(1, '#8b5cf6');
      
      // Dibujar fondo redondeado
      const radius = size * 0.2;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Icono central (símbolo de suscripción/refresh)
      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = size * 0.04;
      ctx.lineCap = 'round';
      
      const centerX = size / 2;
      const centerY = size / 2;
      const iconRadius = size * 0.25;
      
      // Dibujar círculo con flechas (símbolo de recurrente)
      ctx.beginPath();
      ctx.arc(centerX, centerY, iconRadius, 0.5, Math.PI * 1.5);
      ctx.stroke();
      
      // Flecha superior
      const arrowSize = size * 0.08;
      ctx.beginPath();
      ctx.moveTo(centerX - arrowSize, centerY - iconRadius - arrowSize);
      ctx.lineTo(centerX, centerY - iconRadius);
      ctx.lineTo(centerX + arrowSize, centerY - iconRadius - arrowSize);
      ctx.stroke();
      
      // Segunda parte del círculo
      ctx.beginPath();
      ctx.arc(centerX, centerY, iconRadius, Math.PI * 1.5 + 0.5, Math.PI * 0.5);
      ctx.stroke();
      
      // Flecha inferior
      ctx.beginPath();
      ctx.moveTo(centerX - arrowSize, centerY + iconRadius + arrowSize);
      ctx.lineTo(centerX, centerY + iconRadius);
      ctx.lineTo(centerX + arrowSize, centerY + iconRadius + arrowSize);
      ctx.stroke();
      
      // Símbolo de peso ($) en el centro
      ctx.font = `bold ${size * 0.2}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', centerX, centerY);
    }
    
    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Generar iconos al cargar
    drawIcon('icon192', 192);
    drawIcon('icon512', 512);
  </script>
</body>
</html>
